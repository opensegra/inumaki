name: Bug report
description: Report a reproducible problem with Inumaki output, theming or types.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Inumaki. Please remove tokens, private URLs and personal paths from any code or output you paste.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Append mode (line format, levels)
        - Live mode (in-place redraw, cursor, interleaved output)
        - Theme, banner or branding
        - Colors (NO_COLOR, FORCE_COLOR, TTY detection)
        - Log file output
        - SignalHandler or exit behavior
        - TypeScript types or package exports
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Inumaki version
      description: Run `npm ls inumaki`.
      placeholder: '0.2.0'
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Node.js, OS and terminal
      description: Node.js 22 or newer is required. Say if output is piped or running in CI.
      placeholder: 'Node 24.1.0, macOS 16, iTerm2 (TTY)'
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Output mode
      options:
        - append
        - live
        - Both
        - Not related to a mode
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest script that shows the problem, including your `Inumaki.create()` options.
      render: ts
      placeholder: |
        import { Inumaki } from 'inumaki';

        const logger = Inumaki.create({ theme: { name: 'ACME' }, mode: 'live' });
        logger.log('step 1');
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      placeholder: "Expected…\nActual…"
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Terminal output
      description: Paste the output as text. For live mode, a screenshot or short recording helps.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I can reproduce this with the latest published version.
          required: true
        - label: I searched existing issues for this problem.
          required: true
